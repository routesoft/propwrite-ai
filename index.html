<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PropWrite AI - Instant Real Estate Listings</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 py-4 px-6 shadow-sm">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-600">🏠 PropWrite AI</h1>
            <span class="text-xs bg-blue-50 text-blue-700 font-medium px-3 py-1 rounded-full border border-blue-100">Powered by Gemini</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-5xl mx-auto px-6 py-10 flex-grow grid grid-cols-1 md:grid-cols-2 gap-8 w-full">
        
        <!-- Input Form Card -->
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
            <div>
                <h2 class="text-lg font-semibold text-slate-900 mb-4">Property Details</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Property Type</label>
                        <select id="propType" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option>Single Family Home</option>
                            <option>Modern Apartment / Condo</option>
                            <option>Downtown Loft</option>
                            <option>Luxury Estate</option>
                            <option>Fixer-Upper / Investment</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Bedrooms / Baths</label>
                            <input type="text" id="bedsBaths" placeholder="e.g. 3 Beds, 2 Baths" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Location / Area</label>
                            <input type="text" id="location" placeholder="e.g. Austin, TX (Suburbs)" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Key Selling Features</label>
                        <textarea id="features" rows="3" placeholder="e.g. Brand new kitchen, hardwood floors, massive fenced backyard, close to top-rated schools..." class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Target Vibe</label>
                        <select id="vibe" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option>Warm & Family-Friendly</option>
                            <option>Sleek & Modern Minimalist</option>
                            <option>Upscale & Luxurious</option>
                            <option>Punchy & High-Energy</option>
                        </select>
                    </div>
                </div>
            </div>

            <button onclick="generateListing()" id="generateBtn" class="mt-6 w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition duration-200 shadow-md">
                Generate Listing Kit
            </button>
        </div>

        <!-- Output Cards Section -->
        <div class="space-y-6 flex flex-col justify-center" id="outputSection">
            
            <!-- Initial Empty State -->
            <div id="placeholderState" class="bg-white border-2 border-dashed border-slate-200 rounded-2xl p-10 text-center flex flex-col items-center justify-center h-full">
                <span class="text-3xl mb-2">✨</span>
                <p class="text-slate-500 text-sm">Fill out the property details on the left and click generate to create your professional marketing kit instantly.</p>
            </div>

            <!-- Results Container (Hidden by default) -->
            <div id="resultsContainer" class="hidden space-y-6">
                <!-- Card 1: MLS Description -->
                <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm relative">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="font-semibold text-slate-900 text-sm">MLS / Zillow Description</h3>
                        <button onclick="copyText('mlsOutput')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-md transition">Copy</button>
                    </div>
                    <div id="mlsOutput" class="text-xs text-slate-600 whitespace-pre-wrap leading-relaxed bg-slate-50 p-3 rounded-lg border border-slate-100 max-h-40 overflow-y-auto"></div>
                </div>

                <!-- Card 2: Social Media Caption -->
                <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm relative">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="font-semibold text-slate-900 text-sm">Social Media Caption (IG / FB)</h3>
                        <button onclick="copyText('socialOutput')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-md transition">Copy</button>
                    </div>
                    <div id="socialOutput" class="text-xs text-slate-600 whitespace-pre-wrap leading-relaxed bg-slate-50 p-3 rounded-lg border border-slate-100 max-h-40 overflow-y-auto"></div>
                </div>

                <!-- Card 3: Email Blast Hook -->
                <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm relative">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="font-semibold text-slate-900 text-sm">Buyer Lead Email Pitch</h3>
                        <button onclick="copyText('emailOutput')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-md transition">Copy</button>
                    </div>
                    <div id="emailOutput" class="text-xs text-slate-600 whitespace-pre-wrap leading-relaxed bg-slate-50 p-3 rounded-lg border border-slate-100 max-h-40 overflow-y-auto"></div>
                </div>
            </div>

        </div>
    </main>

    <!-- Script Logic -->
    <script>
        async function generateListing() {
            const propType = document.getElementById('propType').value;
            const bedsBaths = document.getElementById('bedsBaths').value;
            const location = document.getElementById('location').value;
            const features = document.getElementById('features').value;
            const vibe = document.getElementById('vibe').value;
            const btn = document.getElementById('generateBtn');

            if (!bedsBaths || !location || !features) {
                alert('Please fill out all property details.');
                return;
            }

            // UI Loading state
            btn.disabled = true;
            btn.innerText = "Writing listing...";
            document.getElementById('placeholderState').classList.remove('hidden');
            document.getElementById('resultsContainer').classList.add('hidden');

            const prompt = `You are an expert real estate copywriter. Generate a marketing kit based on these details:
            - Property Type: ${propType}
            - Specs: ${bedsBaths}
            - Location: ${location}
            - Key Features: ${features}
            - Tone/Vibe: ${vibe}

            Strictly format your response by separating the three sections using exact headers like this:
            ---MLS---
            (Write a comprehensive, professional MLS/Zillow description loaded with appealing real estate language and keywords)
            ---SOCIAL---
            (Write a catchy Instagram/Facebook caption packed with relevant emojis and property hashtags)
            ---EMAIL---
            (Write a short, high-converting teaser email pitch to send to buyer leads)`;

            try {
                // Connected to your Cloudflare Worker proxy
                const workerUrl = "https://realestateai.tashina908.workers.dev";

                const response = await fetch(workerUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message || JSON.stringify(data.error));
                }

                const rawText = data.candidates[0].content.parts[0].text;

                // Parse the custom split markers
                const mlsMatch = rawText.match(/---MLS---([\s\S]*?)(?=---SOCIAL---|$)/);
                const socialMatch = rawText.match(/---SOCIAL---([\s\S]*?)(?=---EMAIL---|$)/);
                const emailMatch = rawText.match(/---EMAIL---([\s\S]*)/);

                document.getElementById('mlsOutput').innerText = mlsMatch ? mlsMatch[1].trim() : rawText;
                document.getElementById('socialOutput').innerText = socialMatch ? socialMatch[1].trim() : "See main description.";
                document.getElementById('emailOutput').innerText = emailMatch ? emailMatch[1].trim() : "See main description.";

                // Switch UI views
                document.getElementById('placeholderState').classList.add('hidden');
                document.getElementById('resultsContainer').classList.remove('hidden');

            } catch (err) {
                alert('Error generating listing: ' + err.message);
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerText = "Generate Listing Kit";
            }
        }

        function copyText(elementId) {
            const text = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(text);
            alert('Copied to clipboard!');
        }
    </script>
</body>
</html>
